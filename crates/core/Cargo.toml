[package]
name = "wealthfolio-core"
version.workspace = true
edition.workspace = true
description = "An Open Source Desktop Portfolio tracker"
authors = ["Aziz Fadil"]
license = "AGPL-3.0"
repository = "https://github.com/wealthfolio/wealthfolio"

[features]
default = []

[dependencies]
argon2 = "0.6"
fs2 = "0.4"
subtle = "2"
zeroize = { workspace = true }
wealthfolio-http = { workspace = true }
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
diesel = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
num-traits = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }

# Sibling crates
wealthfolio-market-data = { path = "../market-data" }
wealthfolio-portfolio-engine = { workspace = true }

# Additional dependencies not in workspace
regex = "1.10"
rand = { workspace = true }
rand_distr = "0.6"
rayon = "1"
urlencoding = "2"
csv = "1.4.0"
chardetng = "1.0"
encoding_rs = "0.8"
zip = "9.2.1"
jsonpath-rust = "0.7"
scraper = "0.27"
sha2 = "0.11"
base64 = "0.22"
hex = "0.4"
chrono-tz = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1.4"
serde_yaml = "0.9"

[lints]
workspace = true
