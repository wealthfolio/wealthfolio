id: EDGE-TXF-17
title: A transfer at cost with recorded acquisition rates needs no rate on the transfer day
intent: >
  Kernel-only. Rules R2.4: covered units carry the sender's cost at its
  historical rates to the base currency whether or not a rate exists on the
  transfer day. No market rate exists at all; both acquisitions record 1.5
  USD/EUR. acc-a sends 10 units to acc-b, which is short 4; acc-b's leg has
  a fee of 5 EUR, capitalised into the lots it opens at their rate.
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-09 }
accounts:
  - { id: acc-a, currency: USD }
  - { id: acc-b, currency: USD }
assets:
  - { id: x, quote_ccy: EUR }
activities:
  - { id: dep-a, account: acc-a, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 2000 }
  - { id: dep-b, account: acc-b, type: DEPOSIT, date: 2025-01-02T11:00:00Z, amount: 2000 }
  - { id: buy-1, account: acc-a, type: BUY, date: 2025-01-03T10:00:00Z, asset: x, quantity: 10, unit_price: 100, amount: 1000, currency: EUR, fx_rate: 1.5 }
  - { id: short-1, account: acc-b, type: SELL, subtype: POSITION_OPEN, date: 2025-01-03T11:00:00Z, asset: x, quantity: 4, unit_price: 110, amount: 440, currency: EUR, fx_rate: 1.5 }
  - { id: out-1, account: acc-a, type: TRANSFER_OUT, date: 2025-01-08T10:00:00Z, asset: x, quantity: 10, unit_price: 100, source_group_id: g1, currency: EUR }
  - { id: in-1, account: acc-b, type: TRANSFER_IN, date: 2025-01-08T11:00:00Z, asset: x, quantity: 10, unit_price: 100, source_group_id: g1, currency: EUR, fee: 5 }
expected_notes: >
  The cover of 4 units: proceeds -400 EUR x 1.5 = -600 USD, against the
  short's cost -440 EUR x 1.5 = -660 USD, so realized P&L in base +60 USD.
  The 6 opened lots carry 600 EUR x 1.5 = 900 USD, plus the fee: 5 EUR x 1.5
  = 7.5 USD. acc-a: outflow 1500 USD on 01-08 (removed cost 1000 EUR at 1.5).
  acc-b: inflow 600 + 907.5 - 7.5 = 1500 USD on 01-08. Before the fixes the
  cover needed the transfer day's rate, which does not exist: the cover
  recorded 0 in base, and both legs flowed nothing (unpriced); then the fee
  still needed that rate to come off the flow. The fee is paid from 5 EUR of
  cash that no rate converts, so acc-b's returns are unavailable.
