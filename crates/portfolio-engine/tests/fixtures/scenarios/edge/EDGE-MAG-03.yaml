id: EDGE-MAG-03
title: A rejected activity leaves no warnings from its attempt
intent: >
  An activity applies whole or not at all, and so do its warnings. The BUY
  is paid in EUR for a GBP-quoted share in a USD account. Its price
  converts to GBP, then the lot finds no GBP->USD rate for its basis (a
  warning for the account and one for the base), then its cost in GBP is
  outside the kernel range, so the activity is rejected. The rejection is
  reported; the warnings of the rolled-back attempt are not, as nothing
  they describe happened. Marked [K].
markers: [K]
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-06
accounts:
  - { id: acc-1, currency: USD }
assets:
  - { id: vod, quote_ccy: GBP }
activities:
  - { id: dep-1, account: acc-1, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 1000 }
  - { id: buy-1, account: acc-1, type: BUY, date: 2025-01-03T10:00:00Z, asset: vod, quantity: 100000, unit_price: 1000000, amount: 100000000000, currency: EUR }
fx_rates:
  - { from: EUR, to: GBP, day: 2025-01-03, rate: 10000000000 }
expected_notes: >
  Cash USD 1000 throughout, no EUR cash, no vod position. The only
  diagnostic about buy-1 is its ActivityRejected error (lot cost outside
  the kernel range).
