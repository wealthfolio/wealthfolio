id: EDGE-NOCASH-01
title: Recorded deposits and withdrawals move nothing when an account does not track cash
intent: >
  Rules R1.6: in an account that does not track cash, money recorded in or
  out of it (a deposit, a withdrawal, a cash transfer paired with no other
  account) moves nothing. NOM-NOCASH-01's two buys with a lump-sum deposit
  before them, a withdrawal, and an unpaired transfer give NOM-NOCASH-01's
  numbers: the lump sum no longer sits idle before the second buy, and the
  unpaired transfer no longer gates returns.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    name: Brokerage
    currency: USD
    cash_tracking: NOT_TRACKED
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T09:00:00Z
    amount: 2100
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-02T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100
    amount: 1000
  - id: buy-2
    account: acc-1
    type: BUY
    date: 2025-01-06T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 110
    amount: 1100
  - id: txf-in
    account: acc-1
    type: TRANSFER_IN
    date: 2025-01-07T10:00:00Z
    amount: 50
  - id: wd-1
    account: acc-1
    type: WITHDRAWAL
    date: 2025-01-08T10:00:00Z
    amount: 100
quotes:
  - { asset: aapl, day: 2025-01-02, close: 100 }
  - { asset: aapl, day: 2025-01-03, close: 110 }
  - { asset: aapl, day: 2025-01-10, close: 121 }
expected_notes: >
  dep-1, txf-in and wd-1 compile to events with no cash, no contribution and
  no flow, and txf-in reports no unknown boundary. Every valuation and
  performance figure equals NOM-NOCASH-01's: cash 0 every day,
  net_contribution 1000 from 01-02 and 2100 from 01-06, value 1000 / 1100 /
  2200 / 2420, an 1100 inflow on 01-06 and no flow on 01-07 or 01-08, TWR
  21%, gain 320. Tracking cash instead, the deposit would hold 1100 idle from
  01-02 to 01-05 (01-03 would return 2200 / 2100 - 1 = 4.761905%, not 10%),
  and the unpaired transfer would gate TWR.
