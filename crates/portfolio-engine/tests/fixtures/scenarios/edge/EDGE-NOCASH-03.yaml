id: EDGE-NOCASH-03
title: A transfer from a cash account into an account that does not track cash
intent: >
  Rules R1.6: a cash transfer paired with another account keeps its pair, so
  the portfolio nets it, and the receiving account, holding no cash, settles
  it out on its day. A buy days later is money in again. The money reads as
  leaving the portfolio between the two days; returns and the gain are
  unaffected.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-bank
    name: Bank
    currency: USD
    account_type: CASH
  - id: acc-brk
    name: Brokerage
    currency: USD
    cash_tracking: NOT_TRACKED
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-bank
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 2000
  - id: out-1
    account: acc-bank
    type: TRANSFER_OUT
    date: 2025-01-03T10:00:00Z
    amount: 1000
    source_group_id: g1
  - id: in-1
    account: acc-brk
    type: TRANSFER_IN
    date: 2025-01-03T11:00:00Z
    amount: 1000
    source_group_id: g1
  - id: buy-1
    account: acc-brk
    type: BUY
    date: 2025-01-06T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100
    amount: 1000
quotes:
  - { asset: aapl, day: 2025-01-06, close: 100 }
  - { asset: aapl, day: 2025-01-10, close: 110 }
expected_notes: >
  acc-bank tracks its cash: 2000, then 1000 from 01-03; net_contribution 2000,
  then 1000. acc-brk ledger: in-1 (+1000, paired with out-1),
  in-1:settle:USD (WITHDRAWAL -1000), buy-1, buy-1:settle:USD (DEPOSIT
  +1000). acc-brk cash is 0 on every day; net_contribution 0 from 01-03 (the
  transfer in, then out), 1000 from 01-06; value 0 (01-03 to 01-05), 1000
  (01-06 to 01-09), 1100 (01-10); its returns start once it holds value, TWR
  10%. Portfolio: value 2000 (01-02), 1000 (01-03 to 01-05), 2000 (01-06 to
  01-09), 2100 (01-10). The pair nets on 01-03, leaving the settlement's
  outflow of 1000; 01-06 has an inflow of 1000. net_contribution 2000, 1000
  from 01-03, 2000 from 01-06. Daily returns 0 on 01-03 and 01-06, 5% on
  01-10: TWR 5%, gain 100.
