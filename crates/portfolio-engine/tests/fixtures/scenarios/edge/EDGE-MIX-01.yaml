id: EDGE-MIX-01
title: A holdings snapshot on the day another account records a flow
intent: >
  acc-t (TRANSACTIONS) deposits 1000 on 01-09, the day acc-h (HOLDINGS)
  records a snapshot with 2 more shares and 200 more cash. The portfolio's
  flow on 01-09 is both: the deposit and the inflow inferred from acc-h's
  transition. Another account's activity on that day does not replace the
  holdings account's own flow (I9 aggregation).
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-12
accounts:
  - id: acc-t
    currency: USD
  - id: acc-h
    currency: USD
    tracking_mode: HOLDINGS
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-t
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: dep-2
    account: acc-t
    type: DEPOSIT
    date: 2025-01-09T10:00:00Z
    amount: 1000
quotes:
  - { asset: aapl, day: 2025-01-02, close: 100 }
  - { asset: aapl, day: 2025-01-09, close: 108 }
  - { asset: aapl, day: 2025-01-12, close: 110 }
observed_snapshots:
  - account: acc-h
    date: 2025-01-02
    source: MANUAL_ENTRY
    positions: [{ asset: aapl, quantity: 10, average_cost: 90 }]
    cash: { USD: 100 }
  - account: acc-h
    date: 2025-01-09
    source: MANUAL_ENTRY
    positions: [{ asset: aapl, quantity: 12, average_cost: 92 }]
    cash: { USD: 300 }
expected_notes: >
  acc-t: cash 1000 -> 2000; flows 01-02 opening, 01-09 inflow 1000
  CASH_AMOUNT. acc-h: value 01-02 1100 (10 x 100 + 100), 01-09 1596
  (12 x 108 + 300), 01-12 1620; flow 01-09 inflow 416 (= 1596 - (10 x 108 +
  100)) QUOTE_DERIVED_MARKET_VALUE. Portfolio flows: 01-09 inflow 1416
  (1000 + 416), MIXED_EXACT. Before the fix the deposit replaced the day's
  flows and the portfolio showed 1000.
