id: EDGE-TXF-21
title: A transfer fee comes off the flow at the rates it was capitalised at
intent: >
  Kernel-only. Rules R2.4: the incoming leg's whole fee goes into the lots it
  opens, each at its own rate to the base currency, and comes off its flow
  at those rates, not at the transfer day's. acc-a holds 5 units bought at
  1 USD/EUR and sends 8 to acc-b, which is short 4; acc-b's leg has a fee of
  5 EUR. The rate is 2 on the transfer day. No quote exists.
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-05 }
accounts:
  - { id: acc-a, currency: USD }
  - { id: acc-b, currency: USD }
assets:
  - { id: x, quote_ccy: EUR }
activities:
  - { id: dep-a, account: acc-a, type: DEPOSIT, date: 2025-01-01T10:00:00Z, amount: 1000 }
  - { id: dep-b, account: acc-b, type: DEPOSIT, date: 2025-01-01T11:00:00Z, amount: 1000 }
  - { id: buy-1, account: acc-a, type: BUY, date: 2025-01-02T10:00:00Z, asset: x, quantity: 5, unit_price: 10, amount: 50, currency: EUR, fx_rate: 1 }
  - { id: short-1, account: acc-b, type: SELL, subtype: POSITION_OPEN, date: 2025-01-02T11:00:00Z, asset: x, quantity: 4, unit_price: 12, amount: 48, currency: EUR, fx_rate: 1 }
  - { id: out-1, account: acc-a, type: TRANSFER_OUT, date: 2025-01-03T10:00:00Z, asset: x, quantity: 8, unit_price: 20, source_group_id: g1, currency: EUR }
  - { id: in-1, account: acc-b, type: TRANSFER_IN, date: 2025-01-03T11:00:00Z, asset: x, quantity: 8, unit_price: 20, fee: 5, source_group_id: g1, currency: EUR }
fx_rates:
  - { from: EUR, to: USD, day: 2025-01-02, rate: 1 }
  - { from: EUR, to: USD, day: 2025-01-03, rate: 2 }
expected_notes: >
  acc-a gives 5 units at 50 EUR, 50 USD: outflow 50 on 01-03. acc-b covers 4
  with 40 USD of them and opens 4 lots: 1 carried unit at 10 USD (rate 1) and
  3 lacked units at 3 x 20 EUR x 2 = 120 USD (rate 2). The 5 EUR fee is
  shared by units: 1.25 EUR at 1 and 3.75 EUR at 2, 8.75 USD. Booked cost 40
  + 10 + 120 + 8.75 = 178.75; acc-b: inflow 178.75 - 8.75 = 170 on 01-03.
  Portfolio: the pair nets the 50 the sender removed, so 120 in. Before the
  fix the fee came off at the transfer day's rate, 10: inflow 168.75, and
  118.75 at the portfolio.
