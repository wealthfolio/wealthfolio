id: EDGE-POS-02
title: Equity short needs explicit intent - plain BUY/SELL rejected atomically
intent: >
  A short position on an EQUITY is opened with SELL subtype POSITION_OPEN
  (explicit intent). A subsequent PLAIN BUY ("would reduce short ... without
  Buy to Cover intent") and a PLAIN SELL ("would increase short ... without
  Sell Short intent") are rejected by `ShortabilityPolicy`
  (`requires_explicit_short_intent`), and because BUY/SELL run against a
  scratch snapshot with a staged side-effect buffer, the rejected rows
  leave ZERO state mutation (no cash, no lots, no disposals). A final BUY
  with subtype POSITION_CLOSE covers exactly the 10 short shares, proving
  the short was untouched.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    currency: USD
assets:
  - id: eq
    symbol: EQ
    quote_ccy: USD
    instrument_type: EQUITY
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 2000
  - id: short-open
    account: acc-1
    type: SELL
    subtype: POSITION_OPEN
    date: 2025-01-03T10:00:00Z
    asset: eq
    quantity: 10
    unit_price: 100
    amount: 1000
  - id: plain-buy-rejected
    account: acc-1
    type: BUY
    date: 2025-01-06T10:00:00Z
    asset: eq
    quantity: 5
    unit_price: 95
    amount: 475
  - id: plain-sell-rejected
    account: acc-1
    type: SELL
    date: 2025-01-06T11:00:00Z
    asset: eq
    quantity: 5
    unit_price: 95
    amount: 475
  - id: cover
    account: acc-1
    type: BUY
    subtype: POSITION_CLOSE
    date: 2025-01-08T10:00:00Z
    asset: eq
    quantity: 10
    unit_price: 90
    amount: 900
quotes:
  - { asset: eq, day: 2025-01-03, close: 100 }
  - { asset: eq, day: 2025-01-06, close: 95 }
  - { asset: eq, day: 2025-01-08, close: 90 }
expected_notes: >
  01-03: cash 3000, position -10 (lot short-open quantity -10, basis
  -1000). 01-06 keyframe: IDENTICAL state (cash 3000, -10 shares) - both
  rejected rows are logged only. 01-08: cover consumes the short lot at
  900 cost: cash 2100, position 0, lot short-open closed, disposal quantity
  10 with proceeds 900 vs basis -1000 and realized +100. Valuations: 01-03
  total 2000 (3000 - 10 x 100); 01-06 2050 (3000 - 950); 01-08 onward 2100.
  net_contribution 2000 throughout.
