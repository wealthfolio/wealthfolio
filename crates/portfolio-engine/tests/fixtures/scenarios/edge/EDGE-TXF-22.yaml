id: EDGE-TXF-22
title: A cover's delivered cost stays known when the covered short has no rate
intent: >
  Kernel-only. Rules R2.4: a cover's proceeds in base are the delivered
  cost, at the sender's historical rates, even when the covered short's own
  cost has no rate; only its realized P&L in base is then unknown (R3.4).
  No market rate exists; acc-a's buy records 1.5 USD/EUR, acc-b's short
  records none.
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-09 }
accounts:
  - { id: acc-a, currency: USD }
  - { id: acc-b, currency: USD }
assets:
  - { id: x, quote_ccy: EUR }
activities:
  - { id: dep-a, account: acc-a, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 2000 }
  - { id: dep-b, account: acc-b, type: DEPOSIT, date: 2025-01-02T11:00:00Z, amount: 2000 }
  - { id: buy-1, account: acc-a, type: BUY, date: 2025-01-03T10:00:00Z, asset: x, quantity: 10, unit_price: 100, amount: 1000, currency: EUR, fx_rate: 1.5 }
  - { id: short-1, account: acc-b, type: SELL, subtype: POSITION_OPEN, date: 2025-01-03T11:00:00Z, asset: x, quantity: 4, unit_price: 110, amount: 440, currency: EUR }
  - { id: out-1, account: acc-a, type: TRANSFER_OUT, date: 2025-01-08T10:00:00Z, asset: x, quantity: 10, unit_price: 100, source_group_id: g1, currency: EUR }
  - { id: in-1, account: acc-b, type: TRANSFER_IN, date: 2025-01-08T11:00:00Z, asset: x, quantity: 10, unit_price: 100, source_group_id: g1, currency: EUR }
expected_notes: >
  acc-a gives 1000 EUR, 1500 USD: outflow 1500 on 01-08. acc-b covers 4
  units: proceeds -400 EUR, -600 USD; the short's cost -440 EUR has no rate,
  so its base cost and realized P&L in base are 0 and warned (local P&L
  +40). The 6 units left carry 600 EUR, 900 USD. acc-b: inflow 600 + 900 =
  1500 on 01-08; the pair nets. Before the fix the short's missing rate
  zeroed the cover's base proceeds too, and acc-b's inflow was unpriced.
