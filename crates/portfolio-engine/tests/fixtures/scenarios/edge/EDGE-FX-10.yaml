id: EDGE-FX-10
title: A direct FX observation beats the inverse of the opposite pair
intent: >
  Kernel-only. Every observation also registers its inverse, but only on
  days the opposite pair has no direct observation of its own. On 01-02
  both CAD->USD (0.70) and USD->CAD (1.30) are observed: CAD->USD resolves
  to its own 0.70, never to 1/1.30. On 01-03 only USD->CAD (1.25) exists,
  so its inverse 0.8 fills the CAD->USD day. Marked [K].
markers: [K]
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-03
accounts:
  - id: acc-1
    currency: CAD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
fx_rates:
  - { from: CAD, to: USD, day: 2025-01-02, rate: 0.70 }
  - { from: USD, to: CAD, day: 2025-01-02, rate: 1.30 }
  - { from: USD, to: CAD, day: 2025-01-03, rate: 1.25 }
expected_notes: >
  Total value 1000 CAD both days; 01-02 fx_rate_to_base 0.7, base 700;
  01-03 fx_rate_to_base 0.8, base 800. Complete. The 01-02 directions
  disagree (0.70 x 1.30 = 0.91), so one ConflictingFxRates warning names the
  pair and that day.
