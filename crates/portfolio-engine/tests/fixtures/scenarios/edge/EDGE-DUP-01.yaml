id: EDGE-DUP-01
title: Duplicate activity ids are a malformed request
intent: >
  Kernel-only. Two facts sharing one ActivityId must produce an
  EngineError (malformed request), never a double-count. The fixture loader
  rejects duplicate ids at load time (fixtures are code), so this file
  carries two DISTINCT ids; the kernel test clones `buy-1` under the same
  id before calling the engine and asserts the error. Marked [K]: the
  legacy pipeline has no notion of this (a duplicate primary key cannot be
  stored, and the in-memory doubles would double-count).
markers: [K]
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-08
accounts:
  - id: acc-1
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 5
    unit_price: 100
    amount: 500
  - id: buy-2
    account: acc-1
    type: BUY
    date: 2025-01-03T11:00:00Z
    asset: aapl
    quantity: 5
    unit_price: 100
    amount: 500
quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
expected_notes: >
  With distinct ids: cash 0, position 10 @ 100. The kernel variant that
  re-ids buy-2 as buy-1 must fail with a malformed-request error and produce
  no projection at all.
