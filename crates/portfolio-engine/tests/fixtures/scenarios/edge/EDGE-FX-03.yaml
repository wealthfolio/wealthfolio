id: EDGE-FX-03
title: Historical FX observations are carried forward without lookahead
intent: >
  CAD account, USD base, cash only, with CAD->USD rates on 01-06, 01-09 and
  01-11 only. Historical valuation uses the most recent observation on or
  before the valued date, carried at most seven calendar days. The dense
  rows pin exact matches and weekend/holiday carry without using future data.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-12
accounts:
  - id: acc-1
    currency: CAD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-06T10:00:00Z
    amount: 1000
fx_rates:
  - { from: CAD, to: USD, day: 2025-01-06, rate: 0.70 }
  - { from: CAD, to: USD, day: 2025-01-09, rate: 0.72 }
  - { from: CAD, to: USD, day: 2025-01-11, rate: 0.74 }
expected_notes: >
  fx_rate_to_base per row: 01-06 0.70 (exact); 01-07 0.70 (carry);
  01-08 0.70 (carry, no lookahead); 01-09 0.72 (exact);
  01-10 0.72 (carry); 01-11 0.74 (exact); 01-12 0.74
  (past only). total_value_base = 1000 x that rate; net_contribution_base
  700 (deposit-date rate) on every row, so the 01-08 row remains 700.
  Performance: TWR 5.71% (700 -> 740), with fx_effect 40 from the original
  CAD cash exposure in both account and portfolio attribution.
