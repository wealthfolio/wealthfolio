id: EDGE-MIX-06
title: Shares from a holdings account cover a short as a transfer from outside
intent: >
  Pins rules R2.3 for an incoming transactions leg. acc-h (HOLDINGS) sends
  10 x to acc-t (TRANSACTIONS), which is short 4. acc-t records its leg on
  01-03 at 10, with a fee of 5; acc-h records its own on 01-05 at 99. The
  transactions side counts on its own day at its own price, without waiting
  for the holdings side, and acc-h's numbers come only from its snapshot
  (R1.2). No quote exists, so the leg is valued at cost (R2.4).
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-05 }
accounts:
  - { id: acc-t, currency: USD }
  - { id: acc-h, currency: USD, tracking_mode: HOLDINGS }
assets:
  - { id: x, quote_ccy: USD }
observed_snapshots:
  - { account: acc-h, date: 2025-01-01, cash: { USD: 100 } }
activities:
  - { id: dep-1, account: acc-t, type: DEPOSIT, date: 2025-01-01T10:00:00Z, amount: 1000 }
  - { id: short-1, account: acc-t, type: SELL, subtype: POSITION_OPEN, date: 2025-01-02T10:00:00Z, asset: x, quantity: 4, unit_price: 12, amount: 48 }
  - { id: in-1, account: acc-t, type: TRANSFER_IN, date: 2025-01-03T10:00:00Z, asset: x, quantity: 10, unit_price: 10, fee: 5, source_group_id: g1 }
  - { id: out-1, account: acc-h, type: TRANSFER_OUT, date: 2025-01-05T10:00:00Z, asset: x, quantity: 10, unit_price: 99, source_group_id: g1 }
expected_notes: >
  The 10 units arrive at acc-t's price, 10: 100 of cost. 4 cover the short
  at 40 (realized 48 - 40 = +8) and 6 open a lot at 60, plus the whole fee
  of 5: 65 (R2.4). Cash: 1000 + 48 - 5 = 1043. acc-t: inflow 40 + 65 - 5 =
  100 on 01-03, not waiting for 01-05 nor using 99. acc-h: worth 100 every day,
  no flow. Portfolio: 100 in on 01-03; no transfer is left pending.
