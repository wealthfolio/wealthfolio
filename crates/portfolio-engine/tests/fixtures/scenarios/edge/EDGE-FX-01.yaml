id: EDGE-FX-01
title: FX resolved through the inverse rate only
intent: >
  The FX table holds only CAD->USD observations; the scenario needs USD->CAD
  (USD-quoted asset and a USD cash bucket in a CAD account) and CAD->USD
  (account to base). `CurrencyConverter::add_historical_rates` stores the
  inverse of every observation, so USD->CAD resolves to 1/rate for the
  position value, the cash bucket, the lot book rate and the cost basis in
  account currency; the base leg uses the direct rate. Rates are given for
  every calendar day so nearest-neighbor selection plays no role here.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    currency: CAD
assets:
  - id: us
    symbol: USS
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: us
    quantity: 5
    unit_price: 100
    amount: 500
    currency: USD
quotes:
  - { asset: us, day: 2025-01-03, close: 100 }
  - { asset: us, day: 2025-01-08, close: 104 }
fx_rates:
  - { from: CAD, to: USD, day: 2025-01-02, rate: 0.70 }
  - { from: CAD, to: USD, day: 2025-01-03, rate: 0.70 }
  - { from: CAD, to: USD, day: 2025-01-04, rate: 0.70 }
  - { from: CAD, to: USD, day: 2025-01-05, rate: 0.70 }
  - { from: CAD, to: USD, day: 2025-01-06, rate: 0.72 }
  - { from: CAD, to: USD, day: 2025-01-07, rate: 0.72 }
  - { from: CAD, to: USD, day: 2025-01-08, rate: 0.72 }
  - { from: CAD, to: USD, day: 2025-01-09, rate: 0.71 }
  - { from: CAD, to: USD, day: 2025-01-10, rate: 0.71 }
expected_notes: >
  Cash buckets from 01-03: CAD 1000, USD -500 (no fx_rate on the trade, so
  it settles in USD). Lot buy-1: fx_rate_to_account 1.42857143 (1/0.70 on
  01-03), fx_rate_to_base 1 (USD position in USD base), basis_base 500,
  cost_basis_account 714.28571429. Valuations (CAD): 01-03 investment
  714.29, cash 285.71, total 1000, fx_rate_to_base 0.70, total_base 700;
  01-06 investment 694.44 (500/0.72), cash 305.56, total 1000, base 720;
  01-08 investment 722.22 (520/0.72), cash 305.56, total 1027.78, base 740;
  01-09 investment 732.39 (520/0.71), cash 295.77, total 1028.17, base
  730. net_contribution 1000 CAD / 700 USD. Performance (base): TWR 4.29%
  (700 -> 730), attribution unrealized 12.86 + fx_effect 7.14 leaves a 10
  residual ("attribution is incomplete", quality partial).
