id: EDGE-CCY-04
title: Money moved in a minor unit is scaled to its major unit
intent: >
  Kernel-only. A GBP account records a deposit and a withdrawal in pence
  (GBp), and an external transfer of a pence-quoted share valued at cost
  (no quote on the day). Cash is valued in pounds, so the flows must be in
  pounds too: a deposit of 1000 GBp is an inflow of 10 GBP, not 1000, and
  the account shows no return on money that merely moved. Marked [K].
markers: [K]
policy:
  base_currency: GBP
  timezone: UTC
  as_of: 2025-01-07
accounts:
  - { id: acc-1, currency: GBP }
assets:
  - { id: vod, quote_ccy: GBp }
activities:
  - { id: dep-1, account: acc-1, type: DEPOSIT, date: 2025-01-01T10:00:00Z, amount: 10 }
  - { id: dep-2, account: acc-1, type: DEPOSIT, date: 2025-01-03T10:00:00Z, amount: 1000, currency: GBp }
  - { id: wd-1, account: acc-1, type: WITHDRAWAL, date: 2025-01-04T10:00:00Z, amount: 500, currency: GBp }
  - { id: tin, account: acc-1, type: TRANSFER_IN, date: 2025-01-05T10:00:00Z, asset: vod, quantity: 10, unit_price: 250, currency: GBp, metadata: { flow: { is_external: true } } }
quotes:
  - { asset: vod, day: 2025-01-06, close: 250 }
expected_notes: >
  Value 10 GBP on 01-01, 20 on 01-03, 15 on 01-04; from 01-06 15 + 10 x 250
  GBp = 40 GBP. Inflow 10 GBP on 01-03, outflow 5 GBP on 01-04, inflow 25
  GBP on 01-05 (cost, no quote that day). TWR 0 over the days with values.
