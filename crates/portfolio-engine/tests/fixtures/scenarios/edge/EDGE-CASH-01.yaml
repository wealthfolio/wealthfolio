id: EDGE-CASH-01
title: Withdrawal exceeding cash while investments cover total value
intent: >
  Deposit 1000, buy 900 of a priced asset, then withdraw 500: the USD cash
  bucket is an unbounded accumulator and goes to -400 with no rejection or
  warning, while total_value stays positive because the position covers it
  (the #1229 mechanism: health fires only on total_value < 0). The kernel
  keeps the numbers and adds a negative-cash diagnostic.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 9
    unit_price: 100
    amount: 900
  - id: wd-1
    account: acc-1
    type: WITHDRAWAL
    date: 2025-01-06T10:00:00Z
    amount: 500
quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
  - { asset: aapl, day: 2025-01-08, close: 110 }
expected_notes: >
  Cash 1000 -> 100 (01-03) -> -400 (01-06). net_contribution 1000 -> 500.
  Valuations: 01-03 total 1000; 01-06 investment 900, cash -400, total 500;
  01-08 investment 990, total 590. Flow on 01-06: outflow 500 CASH_AMOUNT.
  TWR reflects only the 01-08 price move (+10% on 900 of 1000 exposure);
  no diagnostics about the negative bucket.
