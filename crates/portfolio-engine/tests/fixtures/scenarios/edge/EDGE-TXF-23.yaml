id: EDGE-TXF-23
title: A short the sender only partly held arrives in full
intent: >
  Kernel-only. Rules R2.5 and R2.1: moving a short is a liability changing
  hands, and the receiver books the short units its activity records, those
  the sender lacked at the transfer's price. acc-a is short 1 and records a
  transfer of 2 (its history starts after the other was shorted); acc-b
  records receiving 2 at 20. No quote exists, so both legs are at cost.
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-06 }
accounts:
  - { id: acc-a, currency: USD }
  - { id: acc-b, currency: USD }
assets:
  - { id: x, quote_ccy: USD }
activities:
  - { id: dep-a, account: acc-a, type: DEPOSIT, date: 2025-01-01T10:00:00Z, amount: 100 }
  - { id: dep-b, account: acc-b, type: DEPOSIT, date: 2025-01-01T11:00:00Z, amount: 100 }
  - { id: short-1, account: acc-a, type: SELL, subtype: POSITION_OPEN, date: 2025-01-02T10:00:00Z, asset: x, quantity: 1, unit_price: 10, amount: 10 }
  - { id: out-1, account: acc-a, type: TRANSFER_OUT, date: 2025-01-04T10:00:00Z, asset: x, quantity: 2, unit_price: 20, source_group_id: g1 }
  - { id: in-1, account: acc-b, type: TRANSFER_IN, date: 2025-01-05T10:00:00Z, asset: x, quantity: 2, unit_price: 20, source_group_id: g1 }
expected_notes: >
  acc-a sends the one short unit it holds, cost -10: inflow 10 on 01-04
  (sending a liability). acc-b books -2 units: the carried one at -10 and
  the lacked one at -20, so -30 of cost: outflow 30 on 01-05. Portfolio:
  the outgoing leg nets whole and the incoming one nets the 10 the sender
  removed, so 20 out on 01-05 (R2.1). Before the fix acc-b booked -1 unit,
  flowed 10, and the portfolio read no flow.
