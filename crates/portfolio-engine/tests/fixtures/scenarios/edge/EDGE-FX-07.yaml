id: EDGE-FX-07
title: A year-old FX observation cannot price historical values or returns
intent: >
  CAD account, USD base, USD-quoted asset, and a single USD->CAD observation
  dated 2024-01-01 while every activity and valuation is in January 2025.
  The observation exceeds the seven-calendar-day carry bound. Both currency
  directions are unavailable; the engine reports missing FX instead of
  borrowing a year-old rate. Base values and returns cannot be represented
  as complete, and the performance curve must not show a measured zero.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-08
accounts:
  - id: acc-1
    currency: CAD
assets:
  - id: us
    symbol: USS
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1300
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: us
    quantity: 5
    unit_price: 100
    amount: 500
    currency: USD
quotes:
  - { asset: us, day: 2025-01-03, close: 100 }
  - { asset: us, day: 2025-01-06, close: 102 }
fx_rates:
  - { from: USD, to: CAD, day: 2024-01-01, rate: 1.30 }
expected_notes: >
  The only USD/CAD observation is dated 2024-01-01, over a year before the
  valued days. The native USD lot still has base rate 1, but its account
  basis cannot convert to CAD. CAD cash and contributions cannot convert
  to USD. Valuations explicitly carry unavailable status and FxUnavailable
  diagnostics. Period returns and summary values are unavailable, with an
  empty return curve instead of a flat zero line.
