expected_notes: >
  Only a valid pair moves lots, so every leg here is unpaired. A: cash 5000
  -> 3000 (01-03) -> 2700 (01-06) -> 2700 (01-10, -200 +200); aapl 20 -> 15
  (01-08) -> 10 (01-09), basis 1000 at the end; net_contribution 5000 ->
  4700 -> 4200 -> 3700 (removed lot basis relieved). Disposals in A on 01-08
  and 01-09: 5 units each, proceeds = basis = 500, P&L 0. B: cash 300 (01-06)
  -> 400 (01-07); the msft leg opens its own lot at its reported price
  (asset-in-b, 5 @ 100, basis 500, open 2025-01-08) and the aapl leg opens
  5.001 @ 100 (qty-in-b, basis 500.1, open 2025-01-09): no AAPL lots cross
  into MSFT and the in-leg keeps its own quantity. B net_contribution 300 ->
  400 -> 900 -> 1400.1. C cash 300 -> 400. Every leg carries an
  InvalidTransferGroup and an UnknownTransferBoundary diagnostic; the flows
  are UNKNOWN_BOUNDARY_TRANSFER (cash legs 0/0, security legs at market:
  01-08 A 550 out / B 1050 in, 01-09 A 550 out / B 550.11 in), so TWR and IRR
  are unavailable on those days at account and portfolio scope.
