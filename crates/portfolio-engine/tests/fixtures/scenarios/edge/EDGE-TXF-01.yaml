id: EDGE-TXF-01
title: Invalid transfer groups are unpaired (unknown boundary), no diagnostics
intent: >
  Five malformed source_group_id groups, one per rule in
  `transfer_pairs::build_transfer_pair`: (g-three) three legs; (g-two-in)
  two TRANSFER_INs; (g-asset) a security group whose legs name different
  assets; (g-qty) a security group whose quantities differ by more than
  1e-6; (g-same) same-account same-currency cash legs. The flow resolver
  treats every leg as unpaired and, lacking an explicit external marker,
  stamps UNKNOWN_BOUNDARY_TRANSFER provenance (which makes TWR unavailable
  on those days) with only log warnings - no diagnostic reaches the
  result. The holdings calculator does NOT validate groups at all: it keys
  the removed-lot cache on the group id alone, so the mismatched-asset and
  mismatched-quantity groups still move A's aapl lots into B (the g-asset
  lots land in B's msft position, and B's 5.001 aapl leg receives exactly
  the 5 cached shares). Kernel: same unpairing plus an InvalidTransferGroup
  diagnostic, and no lot movement for invalid groups.
