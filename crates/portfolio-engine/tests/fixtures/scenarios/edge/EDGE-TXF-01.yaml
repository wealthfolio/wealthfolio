expected_notes: >
  Holdings: A cash 5000 -> 3000 (01-03) -> 2700 (01-06) -> 2700 (01-10,
  -200 +200); A aapl 20 -> 15 (01-08) -> 10 (01-09), basis 1000 at the
  end; A net_contribution 5000 -> 4700 -> 4200 -> 3700 (removed lot basis
  relieved). B cash 300 (01-06) -> 400 (01-07); B msft position from 01-08
  holding the 5 cached AAPL lots (quantity 5, basis 500, lot open_date
  2025-01-03, id asset-in-b) - legacy cross-asset lot movement; B aapl
  position from 01-09 quantity 5 (not 5.001), basis 500; B net_contribution
  300 -> 400 -> 900 -> 1400. C cash 300 -> 400. Disposals in A on 01-08 and
  01-09: 5 units each, proceeds = basis = 500, P&L 0. Flows: every unpaired
  leg is stamped UNKNOWN_BOUNDARY_TRANSFER; CASH legs carry a ZERO amount
  (the resolver returns no value for an unknown-boundary cash transfer) so
  01-06, 01-07 and 01-10 show 0/0 markers, while the SECURITY legs carry the
  quote-derived market value: 01-08 A outflow 550 (5 x 110) / B inflow 1050
  (5 x msft 210), 01-09 A outflow 550 / B inflow 550.11 (5.001 x 110 even
  though only 5 shares were booked). TWR and IRR are not applicable on
  those days ("transfer boundary is unknown") at account and portfolio
  scope. Diagnostics: the valuation flow path only logs, but the
  portfolio-scope performance emits one "Transfer group X is invalid (...)"
  warning per group (five), plus "External cash flow provenance is
  incomplete" and attribution-incomplete warnings; the account-scope
  performance carries no invalid-group warning.
