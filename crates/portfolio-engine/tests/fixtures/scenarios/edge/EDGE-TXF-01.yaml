id: EDGE-TXF-01
title: Invalid transfer groups are unpaired (unknown boundary), no diagnostics
intent: >
  Five malformed source_group_id groups, one per pairing rule: (g-three)
  three legs; (g-two-in) two TRANSFER_INs; (g-asset) a security group whose
  legs name different assets; (g-qty) a security group whose quantities
  differ by more than 1e-6; (g-same) same-account same-currency cash legs.
  Every leg is unpaired with an InvalidTransferGroup diagnostic and, lacking
  an explicit external marker, an unknown boundary that gates returns. Lots
  travel through the transfer cache only for a valid pair: an invalid
  group's out-leg relieves its lots and its in-leg opens a lot at its own
  price, never another asset's lots. Marked [L]: the previous pipeline keyed
  the lot cache on the group id alone and moved AAPL lots into an MSFT
  position.
markers: [L]
