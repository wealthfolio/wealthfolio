id: EDGE-FX-06
title: End-of-day cash totals with an unconvertible currency bucket
intent: >
  USD account and base; a DEPOSIT in XYZ (a syntactically valid code with
  no FX observation anywhere). `HoldingsCalculator::compute_cash_totals`
  catches the failed conversion and ADDS the raw XYZ amount into both
  cash_total_account_currency and cash_total_base_currency ("Using
  unconverted"), and the deposit handler adds the raw amount to
  net_contribution while skipping the base leg. The valuation stage then
  fails the account because the XYZ bucket cannot be converted. Kernel:
  degraded status + diagnostic, never a silent add.
markers: [L]
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-08
accounts:
  - id: acc-1
    currency: USD
activities:
  - id: dep-usd
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: dep-xyz
    account: acc-1
    type: DEPOSIT
    date: 2025-01-03T10:00:00Z
    amount: 250
    currency: XYZ
expected_notes: >
  Keyframe 01-03: cash {USD 1000, XYZ 250}; the XYZ bucket has no rate, so
  it is excluded from cash_total_account_currency and _base_currency (both
  1000) and from net_contribution (1000, "net contribution not updated")
  with diagnostics, never counted as 250 USD. Valuations from 01-03 are
  Unavailable at 1000 with the bucket excluded, and the 01-03 deposit's flow
  is UNKNOWN (0/0) so returns are gated. Previously the XYZ amount was added
  as if it were USD and the valuation failed outright.
