id: EDGE-CB-05
title: A WAC pool's transfer with a fee nets at its average cost in base
intent: >
  Rules R7.2, R2.4. acc-a (WAC) bought a EUR asset at two EUR/USD rates and
  transfers part of it, without a quote, to acc-b (FIFO), whose incoming leg
  pays a fee. The pool's rate to USD is its book cost over its cost, so the
  slice carries the average cost in EUR and in USD. The receiver capitalises
  the fee into the lot at the slice's rate and flows the delivered cost less
  that fee: the pair nets to zero at portfolio scope. A later FIFO sale
  realizes against the fee-inclusive cost at that rate.
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-10 }
accounts:
  - { id: acc-a, currency: EUR, cost_basis_method: WAC }
  - { id: acc-b, currency: EUR }
assets:
  - { id: x, quote_ccy: EUR }
activities:
  - { id: dep-1, account: acc-a, type: DEPOSIT, date: 2025-01-02T09:00:00Z, amount: 3000 }
  - { id: dep-2, account: acc-b, type: DEPOSIT, date: 2025-01-02T09:30:00Z, amount: 100 }
  - { id: buy-1, account: acc-a, type: BUY, date: 2025-01-03T10:00:00Z, asset: x, quantity: 10, unit_price: 100, amount: 1000, fee: 0 }
  - { id: buy-2, account: acc-a, type: BUY, date: 2025-01-06T10:00:00Z, asset: x, quantity: 10, unit_price: 120, amount: 1200, fee: 0 }
  - { id: out-1, account: acc-a, type: TRANSFER_OUT, date: 2025-01-08T10:00:00Z, asset: x, quantity: 5, unit_price: 110, source_group_id: g1 }
  - { id: in-1, account: acc-b, type: TRANSFER_IN, date: 2025-01-08T11:00:00Z, asset: x, quantity: 5, unit_price: 110, fee: 2, source_group_id: g1 }
  - { id: sell-1, account: acc-b, type: SELL, date: 2025-01-09T10:00:00Z, asset: x, quantity: 3, unit_price: 130, amount: 390, fee: 0 }
fx_rates:
  - { from: EUR, to: USD, day: 2025-01-02, rate: 1.10 }
  - { from: EUR, to: USD, day: 2025-01-03, rate: 1.10 }
  - { from: EUR, to: USD, day: 2025-01-06, rate: 1.20 }
expected_notes: >
  buy-1: 10 units, 1000 EUR at 1.10 = 1100 USD; buy-2: 10 units, 1200 EUR
  at 1.20 = 1440 USD. out-1 pools them into buy-1 (20 units, 2200 EUR, 2540
  USD; its rate 2540 / 2200 = 1.15454545...) and takes a quarter: 5 units,
  550 EUR, 635 USD, acquired 01-03; outflow 635 USD on 01-08. in-1 books one
  lot in-1: 5 units, 550 EUR plus its 2 EUR fee = 552 EUR at the slice's
  rate (637.30909091 USD); it flows that less the fee at the same rate
  (2.30909091 USD): 635 USD. The pair nets to zero at portfolio scope.
  acc-b cash 100 - 2 = 98 EUR, then sell-1 (FIFO) takes 3 of in-1's 5: cost
  331.2 EUR (382.38545455 USD); proceeds 390 EUR at the 01-06 rate 1.20 =
  468 USD; P&L 58.8 EUR, 85.61454545 USD. acc-b keeps 2 units at 220.8
  EUR; cash 98 + 390 = 488 EUR. acc-a keeps 15 units, 1650 EUR, 1905 USD;
  cash 3000 - 2200 = 800 EUR.
