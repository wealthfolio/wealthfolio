id: EDGE-MIX-07
title: Shares from a holdings account that only cover a short capitalise no fee
intent: >
  Pins rules R2.3 and R2.4 for a cover-only leg with no sender lots. acc-h
  (HOLDINGS) sends 10 x to acc-t (TRANSACTIONS), which is short exactly 10.
  acc-t records its leg on 01-03 at 10 with a fee of 5. The units have no
  sender lot, so they are valued at the leg's own price; they all cover the
  short and open no lot, so the fee is a charge, not part of their cost.
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-05 }
accounts:
  - { id: acc-t, currency: USD }
  - { id: acc-h, currency: USD, tracking_mode: HOLDINGS }
assets:
  - { id: x, quote_ccy: USD }
observed_snapshots:
  - { account: acc-h, date: 2025-01-01, cash: { USD: 100 } }
activities:
  - { id: dep-1, account: acc-t, type: DEPOSIT, date: 2025-01-01T10:00:00Z, amount: 1000 }
  - { id: short-1, account: acc-t, type: SELL, subtype: POSITION_OPEN, date: 2025-01-02T10:00:00Z, asset: x, quantity: 10, unit_price: 12, amount: 120 }
  - { id: in-1, account: acc-t, type: TRANSFER_IN, date: 2025-01-03T10:00:00Z, asset: x, quantity: 10, unit_price: 10, fee: 5, source_group_id: g1 }
  - { id: out-1, account: acc-h, type: TRANSFER_OUT, date: 2025-01-05T10:00:00Z, asset: x, quantity: 10, unit_price: 99, source_group_id: g1 }
expected_notes: >
  The 10 units cost 10 x 10 = 100 and cover the short: proceeds -100 against
  its cost -120, realized +20. No lot opens. Cash: 1000 + 120 - 5 = 1115.
  acc-t: inflow 100 on 01-03; the fee of 5 is a charge. acc-h: worth 100
  every day, no flow. Portfolio: 100 in on 01-03. Before the fix the fee
  went into the units' cost before they covered the short: proceeds -105,
  realized +15, and an inflow of 105.
