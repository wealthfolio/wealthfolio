id: EDGE-CUR-02
title: Every currency candidate empty at normalize
intent: >
  Kernel-only: an activity whose currency is "" for an asset whose quote
  currency is also "" leaves normalize with no currency candidate at all
  (activity, asset, account fallback is the last resort). The kernel must
  emit a diagnostic instead of any silent default currency. The account is
  CAD on a USD base so a hidden USD default would show up as a failed
  CAD->USD conversion; the position must take the activity's (account)
  currency instead. Marked [K].
markers: [K]
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-08
accounts:
  - id: acc-1
    currency: CAD
assets:
  - id: blank
    symbol: BLANK
    quote_ccy: ""
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: buy-blank
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: blank
    quantity: 5
    unit_price: 100
    amount: 500
    currency: ""
quotes:
  - { asset: blank, day: 2025-01-03, close: 100, currency: "" }
fx_rates:
  - { from: CAD, to: USD, day: 2025-01-02, rate: 0.75 }
expected_notes: >
  Kernel golden only. Normalize reports MissingCurrency for the asset, the
  activity and the quote. The BUY books in CAD (the account currency): cash
  500 CAD (375 USD base at 0.75), a CAD position of 5 units with basis 500.
  The quote has no currency and the asset none to lend it, so it is
  ignored: the position is unpriced (MissingQuote) and the days are
  partialUnpriced; a hidden USD default would instead price it and convert
  it as USD. Never a "" bucket, never a default currency.
