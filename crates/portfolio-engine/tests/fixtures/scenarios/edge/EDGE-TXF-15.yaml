id: EDGE-TXF-15
title: An unquoted transfer into a short flows the cost of every unit it delivers
intent: >
  Kernel-only. NOM-TXF-04 without quotes: acc-b is short 4 aapl when a
  paired transfer brings 10 long units (basis 100.5 each) from acc-a. The
  first 4 cover the short and the other 6 open lots. Without a quote both
  legs flow at cost: the incoming leg delivered all 10 units, so it flows
  1005 (6 opened at 603 plus 4 covering at 402), as the outgoing leg flows
  the 1005 it removed.
markers: [K]
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-12 }
accounts:
  - { id: acc-a, currency: USD }
  - { id: acc-b, currency: USD }
assets:
  - { id: aapl, quote_ccy: USD }
activities:
  - { id: dep-1, account: acc-a, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 2000 }
  - { id: dep-2, account: acc-b, type: DEPOSIT, date: 2025-01-02T11:00:00Z, amount: 2000 }
  - { id: buy-1, account: acc-a, type: BUY, date: 2025-01-03T10:00:00Z, asset: aapl, quantity: 10, unit_price: 100, amount: 1005, fee: 5 }
  - { id: short-1, account: acc-b, type: SELL, subtype: POSITION_OPEN, date: 2025-01-03T11:00:00Z, asset: aapl, quantity: 4, unit_price: 100, amount: 400, fee: 0 }
  - { id: out-1, account: acc-a, type: TRANSFER_OUT, date: 2025-01-08T10:00:00Z, asset: aapl, quantity: 10, unit_price: 100.5, source_group_id: g1 }
  - { id: in-1, account: acc-b, type: TRANSFER_IN, date: 2025-01-08T11:00:00Z, asset: aapl, quantity: 10, unit_price: 100.5, source_group_id: g1 }
expected_notes: >
  acc-a: outflow 1005 on 01-08 (the removed basis). acc-b: the transfer
  covers the 4 short (cover proceeds 402) and opens 6 lots (603); inflow
  1005 on 01-08. Before the fix acc-b flowed only the 603 of opened lots.
