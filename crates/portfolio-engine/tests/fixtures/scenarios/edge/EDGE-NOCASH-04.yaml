id: EDGE-NOCASH-04
title: Foreign-currency activities in an account that does not track cash
intent: >
  Rules R1.6 with R3.4: a EUR account that does not track cash buys a USD
  asset and receives a USD dividend. Each settles in the currency its cash
  moved in, as a deposit or withdrawal recorded in USD would, at that day's
  rate. The account holds no USD cash, so the only currency effect is on the
  holding.
policy:
  base_currency: EUR
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    name: Brokerage
    currency: EUR
    cash_tracking: NOT_TRACKED
assets:
  - id: msft
    quote_ccy: USD
activities:
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-02T10:00:00Z
    asset: msft
    quantity: 10
    unit_price: 100
    amount: 1000
    currency: USD
  - id: div-1
    account: acc-1
    type: DIVIDEND
    date: 2025-01-06T10:00:00Z
    asset: msft
    amount: 10
    currency: USD
quotes:
  - { asset: msft, day: 2025-01-02, close: 100 }
  - { asset: msft, day: 2025-01-10, close: 100 }
fx_rates:
  - { from: USD, to: EUR, day: 2025-01-02, rate: 0.90 }
  - { from: USD, to: EUR, day: 2025-01-03, rate: 0.90 }
  - { from: USD, to: EUR, day: 2025-01-04, rate: 0.90 }
  - { from: USD, to: EUR, day: 2025-01-05, rate: 0.90 }
  - { from: USD, to: EUR, day: 2025-01-06, rate: 0.95 }
  - { from: USD, to: EUR, day: 2025-01-07, rate: 0.95 }
  - { from: USD, to: EUR, day: 2025-01-08, rate: 0.95 }
  - { from: USD, to: EUR, day: 2025-01-09, rate: 0.95 }
  - { from: USD, to: EUR, day: 2025-01-10, rate: 1.00 }
expected_notes: >
  Ledger: buy-1, buy-1:settle:USD (DEPOSIT +1000 USD), div-1, div-1:settle:USD
  (WITHDRAWAL -10 USD). The USD cash bucket is 0 on every day.
  net_contribution (EUR) 1000 x 0.90 = 900 from 01-02, 900 - 10 x 0.95 =
  890.5 from 01-06. Value: 900 (01-02 to 01-05), 950 (01-06 to 01-09), 1000
  (01-10). 01-06 has an outflow of 9.5. Daily returns: 01-06 (950 + 9.5 -
  900) / 900 = 6.611111%; 01-10 1000 / 950 - 1 = 5.263158%. TWR 12.222222%.
  Gain 1000 - 890.5 = 109.5: the holding's currency move 1000 x (1.00 -
  0.90) = 100, plus income 10 x 0.95 = 9.5.
