id: EDGE-QT-06
title: A zero quote close is a broken row, not a price
intent: >
  Kernel-only. A quote row with close 0 (a provider glitch) sits between two
  real observations. Using it would value the position at nothing on that
  day with status Complete. The kernel drops the row at normalize with an
  InvalidQuote diagnostic, and the carry-forward rule keeps the previous
  real close until the next one. Marked [K].
markers: [K]
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-08
accounts:
  - id: acc-1
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 2000
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100
    amount: 1000
quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
  - { asset: aapl, day: 2025-01-05, close: 0 }
  - { asset: aapl, day: 2025-01-08, close: 110 }
expected_notes: >
  Kernel golden: normalize reports InvalidQuote for aapl@2025-01-05. The
  position is priced 100 from 01-03 through 01-07 (carried from 01-03, never
  0) and 110 on 01-08; investment 1000 then 1100, every day complete.
