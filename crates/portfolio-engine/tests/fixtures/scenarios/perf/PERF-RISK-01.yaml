expected_notes: >
  46 valuation rows (01-02..02-16), value 1000 on 01-02, 1200 on 01-16, 1020
  on 01-31, 1250 from 02-15. TWR = value_return = 0.25; annualized (both) =
  1.25^(365.25/45) - 1 = 5.11767. IRR: -1000 @01-02, +1250 @02-16 ->
  annualized ~5.1177, period irr 0.25. Volatility 0.21952 (ln-return sample
  stdev 0.011486 x 19.1115; the 01-03 sample uses the 01-02 buy-day value).
  max_drawdown -0.15, peak_date 2025-01-16, trough_date 2025-01-31,
  recovery_date 2025-02-12, drawdown_duration_days 27. Series final point
  0.25 = headline. Attribution: contributions 1000, unrealized 250. No
  warnings; quality ok.
