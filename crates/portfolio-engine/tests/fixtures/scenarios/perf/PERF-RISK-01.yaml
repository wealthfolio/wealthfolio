id: PERF-RISK-01
title: Volatility, max drawdown and annualization over a 45-day path
intent: >
  One asset bought on day 1 with 45 daily quotes: a linear rise 100 -> 120
  (01-02..01-16), a 15% fall to 102 (01-31) and a recovery to 125 (02-15).
  Cash is zero so total value = 10 x price and every daily TWR sample is a
  pure price return. Pins the risk constants: volatility = sample stdev of
  ln(1 + r) x sqrt(365.25) over the 45 daily samples (the flat as_of day
  included), max drawdown -0.15 with peak 01-16, trough 01-31, recovery on the
  first day the cumulative value re-reaches the peak (02-12, price 120.40),
  duration 27 days, and geometric annualization because the 45-day period
  clears the 30-day gate.
