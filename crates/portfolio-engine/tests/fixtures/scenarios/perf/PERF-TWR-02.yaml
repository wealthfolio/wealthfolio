id: PERF-TWR-02
title: Dormant dust days pause compounding without nulling the headline
intent: >
  After a near-total withdrawal the account holds 0.005 USD for several days.
  Those days have a TWR denominator (opening value + inflow) in [0, 1), which
  legacy treats as benign dormant/dust days: the daily sample is excluded from
  compounding and the cumulative series carries forward, but the headline TWR
  is NOT nulled. Compounding resumes when a deposit lifts the denominator to
  >= 1 base unit. Quotes only matter after the resumption buy.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-14
accounts:
  - id: acc-1
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: wd-1
    account: acc-1
    type: WITHDRAWAL
    date: 2025-01-03T10:00:00Z
    amount: 999.995
  - id: dep-2
    account: acc-1
    type: DEPOSIT
    date: 2025-01-08T10:00:00Z
    amount: 500
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-08T11:00:00Z
    asset: aapl
    quantity: 5
    unit_price: 100
    amount: 500
quotes:
  - { asset: aapl, day: 2025-01-08, close: 100 }
  - { asset: aapl, day: 2025-01-10, close: 104 }
  - { asset: aapl, day: 2025-01-12, close: 110 }
expected_notes: >
  Values: 01-02 1000; 01-03..01-07 0.005 (dust); 01-08 500.005 (deposit 500,
  buy 5 @ 100 -> cash 0.005 + position 500); 01-10 520.005; 01-12..01-14
  550.005. TWR samples: 01-03 (0.005 + 999.995 - 1000)/1000 = 0 (chain starts);
  01-04..01-07 denominator 0.005 < 1 -> paused/excluded, series stays 0;
  01-08 (500.005 - 0.005 - 500)/500.005 = 0; 01-10 20/500.005 = 0.0399996;
  01-12 30/520.005 = 0.05769175. Headline TWR = 550.005/500.005 - 1 =
  0.099999 (NOT null); series 0 through 01-09, 0.0399996 on 01-10/11, 0.099999
  from 01-12. Legacy logs the paused days at debug level only: NO warning or
  not-applicable reason reaches diagnostics and quality stays ok. Flows: 01-03
  outflow 999.995, 01-08 inflow 500 (CASH_AMOUNT). Value return =
  (550.005 - 1000 + 499.995)/1000 = 0.05. IRR converges (four dated flows).
  Attribution: contributions 1500, distributions 999.995, unrealized 50.
