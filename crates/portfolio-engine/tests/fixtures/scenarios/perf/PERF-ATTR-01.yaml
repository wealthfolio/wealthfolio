expected_notes: >
  acc-1: cash CAD 2000 - 1356.75 (buy at fx 1.35) - 20 + 652.12 (sell at
  1.37) = 1275.37; cash USD 40 (net dividend, activity-currency bucket). Lot
  buy-1: 10 @ 100.5 USD basis 1005 incl. fee 5, fx_rate_to_account 1.35;
  after the sell 6 remain (basis 603 USD = 814.05 CAD). Disposal sell-1:
  proceeds 476 USD, cost 402, realized 74 USD; base 652.12 - 542.7 = 109.42.
  End value 01-10: 1275.37 + 40 x 1.38 + 6 x 125 x 1.38 = 2365.57; TWR and
  value_return = 2365.57/2000 - 1 = 0.182785 (no flows after day 1).
  Attribution (inception): contributions 2000; income 50 x 1.36 = 68; taxes
  10 x 1.36 = 13.6; fees 5 x 1.35 + 4 x 1.37 + 20 = 32.23; realized 109.42 +
  gross-up (sell fee 5.48 + disposed share of the buy fee 6.75 x 4/10 = 2.7)
  = 117.6; unrealized (1035 - 814.05) + remaining buy-fee gross-up 4.05 =
  225; fx_effect 0 (account currency == base: the 18.09 of position FX
  drift stays inside unrealized). Components sum to 2364.77 vs delta
  2365.57: unreconciled 0.8 (USD cash drift) < tolerance 4.73, no warning,
  residual field 0, summary amount 364.77.
  acc-2: cash USD 100, lot buy-2 9 @ 100 (base 1215 at 1.35); values CAD
  1350 -> 1690.5 (100 x 1.38 + 1125 x 1.38); TWR = value_return =
  1690.5/1350 - 1 = 0.25222222; contributions 1350; unrealized = local change
  225 USD x 1.38 = 310.5; fx_effect = (1552.5 - 1215) - 310.5 = 27;
  components 1687.5 vs delta 1690.5: unreconciled 3 (cash drift) <
  tolerance 3.381, no warning.
  Portfolio (both, base CAD): fx_effect 27 (scoped pass: acc-1 contributes 0
  because its account currency is the base), unrealized 535.5, realized
  117.6, income 68, fees 32.23, taxes 13.6, contributions 3350; delta
  4056.07 vs components 4052.27, unreconciled 3.8 < tolerance 8.11.
  LEGACY BEHAVIOR (ledger candidates): fx_effect is an account-vs-base
  quantity only (position-currency FX inside a base-currency account is
  never separated), and idle foreign-cash FX drift is silently absorbed by
  the tolerance rather than reported as an explicit unreconciled term (I8).
