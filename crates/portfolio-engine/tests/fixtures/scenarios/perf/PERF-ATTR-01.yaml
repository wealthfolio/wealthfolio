id: PERF-ATTR-01
title: Attribution reconciles within tolerance with an FX effect
intent: >
  Base CAD. acc-1 is a CAD account trading a USD-quoted asset while USD/CAD
  drifts from 1.35 to 1.38; every attribution component is exercised:
  contributions, gross income with withholding tax, a standalone fee, trade
  fees on the buy and the sell (grossed up out of lot basis / disposal
  proceeds), realized P&L on a FIFO disposal and unrealized change. Legacy
  only separates fx_effect when the ACCOUNT currency differs from base, so
  acc-1 (CAD account, CAD base) reports fx_effect 0 with the position's FX
  drift folded into unrealized P&L. acc-2 is a USD account holding the same
  asset: there fx_effect = base unrealized change - local unrealized change x
  end FX. In both accounts the unattributed FX drift of idle foreign cash
  stays under the tolerance max(1, 0.2% x max(|delta|, |end value|)), so no
  residual warning fires; the golden's `residual` field is always 0 (legacy
  only surfaces the unreconciled delta as a warning when it exceeds
  tolerance).
