id: PERF-TWR-01
title: Flow timing convention with a same-day deposit and price move
intent: >
  Pins the daily TWR convention r = (V_t + out - V_{t-1} - in) / (V_{t-1} + in):
  inflows are start-of-day (they enlarge the denominator), outflows are
  end-of-day (added back to the numerator), and days chain-link. A deposit
  lands on the same day as a price move so the denominator choice is visible
  (90 / 1510, not 90 / 1010). Daily quotes make every series point non-trivial
  and the final series point must equal the headline TWR by construction.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100
    amount: 1000
  - id: dep-2
    account: acc-1
    type: DEPOSIT
    date: 2025-01-06T10:00:00Z
    amount: 500
  - id: wd-1
    account: acc-1
    type: WITHDRAWAL
    date: 2025-01-08T10:00:00Z
    amount: 200
quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
  - { asset: aapl, day: 2025-01-04, close: 102 }
  - { asset: aapl, day: 2025-01-05, close: 101 }
  - { asset: aapl, day: 2025-01-06, close: 110 }
  - { asset: aapl, day: 2025-01-07, close: 112 }
  - { asset: aapl, day: 2025-01-08, close: 108 }
  - { asset: aapl, day: 2025-01-09, close: 111 }
  - { asset: aapl, day: 2025-01-10, close: 115 }
expected_notes: >
  Total value (cash + 10 x price): 01-02 1000, 01-03 1000, 01-04 1020,
  01-05 1010, 01-06 1600 (deposit 500 + price 110), 01-07 1620, 01-08 1380
  (withdrawal 200, price 108), 01-09 1410, 01-10 1450.
  Daily returns: 01-03 0; 01-04 0.02; 01-05 -0.00980392; 01-06 90/1510 =
  0.05960265 (inflow in the denominator, NOT 90/1010); 01-07 0.0125; 01-08
  (1380 + 200 - 1620)/1620 = -0.02469136; 01-09 0.02173913; 01-10 0.02836879.
  Headline TWR = 1.01 x 1580/1510 x 1450/1380 - 1 = 0.11042806 and the series
  (0, 0, 0.02, 0.01, 0.07019868, 0.08357616, 0.05682119, 0.07979557,
  0.11042806) ends on it. Flows: 01-06 inflow 500 CASH_AMOUNT, 01-08 outflow
  200 CASH_AMOUNT. Value return = (1450 - 1000 - 300)/1000 = 0.15. Attribution
  (inception): contributions 1500, distributions 200, unrealized 150 ->
  reconciles to 1450, residual 0. IRR 0.12554343 over 8 days (annualized
  220.3). Max drawdown -0.02469136 (peak 01-07, trough 01-08, recovery
  01-10). No annualization of TWR (8 days < 30). No diagnostics.
