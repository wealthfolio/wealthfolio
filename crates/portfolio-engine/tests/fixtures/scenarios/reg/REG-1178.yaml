id: REG-1178
title: Backfilled quotes after a PartialUnpriced period (issue #1178)
markers: [S]
intent: >
  Shell-level scenario. msft is bought on 01-04 but its first quote is on
  01-08, so 01-04..01-07 are PARTIAL_UNPRICED rows whose totals exclude the
  msft position. The lifecycle step backfills msft quotes for those days and
  reruns the legacy IncrementalFromLast valuation: legacy appends from the
  last persisted row and never reprices the persisted 01-04..01-07 rows, so
  they keep their stale status and understated totals while a full rebuild
  prices them COMPLETE. The coordinator's per-asset quote watermark is what
  moves the fingerprint and revalues the affected span; the kernel side is
  covered by determinism (same facts -> repriced day). Kept with the
  lifecycle so a temporary capture shows matches_full_rebuild: false.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
  - id: msft
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 2000
  - id: buy-aapl
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 5
    unit_price: 100
    amount: 500
  - id: buy-msft
    account: acc-1
    type: BUY
    date: 2025-01-04T10:00:00Z
    asset: msft
    quantity: 10
    unit_price: 50
    amount: 500
quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
  - { asset: aapl, day: 2025-01-06, close: 104 }
  - { asset: aapl, day: 2025-01-10, close: 110 }
  - { asset: msft, day: 2025-01-08, close: 52 }
  - { asset: msft, day: 2025-01-10, close: 55 }
lifecycle:
  - label: backfill_msft_then_incremental
    as_of: 2025-01-11
    add_quotes:
      - { asset: msft, day: 2025-01-04, close: 50 }
      - { asset: msft, day: 2025-01-05, close: 50.5 }
      - { asset: msft, day: 2025-01-06, close: 51 }
      - { asset: msft, day: 2025-01-07, close: 51.5 }
    recalc: { snapshots: NONE, valuations: INCREMENTAL_FROM_LAST }
expected_notes: >
  Baseline: cash 1000 from 01-04; values 01-02 2000, 01-03 2000, 01-04..01-05
  1500 (msft unpriced, PARTIAL_UNPRICED, performance_eligible 1500), 01-06..
  01-07 1520 (PARTIAL_UNPRICED), 01-08 2040 (COMPLETE: 520 + 520 + 1000),
  01-10 2100. TWR warns "Some valuation rows exclude unpriced held
  positions"; the chained series dips to -0.25 on 01-04 because the unpriced
  buy reads as a loss. After the step a full rebuild prices 01-04 at 2000,
  01-05 at 2005, 01-06 at 2030, 01-07 at 2035 (all COMPLETE, quality ok, no
  drawdown); the incremental run keeps the four stale rows and only appends
  01-11 (2100). Temporary capture with the marker removed (2026-09-02):
  matches_full_rebuild false, differences on valuations[2..5]
  (total_value 1500/1500/1520/1520 vs 2000/2005/2030/2035, value_status
  partialUnpriced vs complete), on the series, risk (max_drawdown -0.25 vs 0)
  and quality (partial vs ok).
