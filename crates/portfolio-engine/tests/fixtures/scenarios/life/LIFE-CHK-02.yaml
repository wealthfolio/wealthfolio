id: LIFE-CHK-02
title: Simulated kill after chunk k resumes to the one-shot result (kernel property)
markers: [K]
intent: >
  Kernel-only (I2, persistence side is a Phase 3 e2e). Same facts shape as
  LIFE-CHK-01: a month straddling the Q1/Q2 boundary with a buy and a split
  in Q1 and a transfer pair, a buy and a sell in Q2. The kernel golden runner
  projects/values chunk 1 (Q1: 03-10..03-31), commits its keyframes, lots,
  valuations and `ProjectionState` checkpoint as one consistent prefix, then
  simulates a kill: chunk 2 is never run in that pass. A second pass resumes
  from the chunk-1 watermark (the persisted checkpoint dated 03-31) and runs
  chunk 2 (04-01..04-10) only. The resumed output — every account's
  keyframes, lots (split_ratio 2 carried across the kill), disposals,
  valuations and stamped flows — must be byte-identical to the one-shot
  goldens; nothing from Q1 may be recomputed or duplicated, and the transfer
  pair opening chunk 2 must still net to zero at portfolio scope. No legacy
  golden: legacy's in-range overwrite runs delete and save as two writes and
  has no resumable watermark (the crash window this scenario retires).
