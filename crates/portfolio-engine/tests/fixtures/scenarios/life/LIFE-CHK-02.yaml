expected_notes: >
  Same one-shot economics as LIFE-CHK-01 (acc-a cash 5000 -> 2995 -> 2195
  -> 2740, position 20 -> 40 -> 30 with lot buy-a1 split_ratio 2; acc-b cash
  1000 -> 1800 -> 1280, 10 aapl; values acc-a 03-31 = 5035, 04-10 = 4420,
  acc-b 04-10 = 1840). After the simulated kill the store holds exactly the
  Q1 prefix (acc-a keyframes 03-10, 03-12, 03-25; acc-b keyframe 03-10;
  valuations through 03-31; checkpoint dated 03-31). After the resume the
  store equals the one-shot goldens: acc-a keyframes 03-10, 03-12, 03-25,
  04-01, 04-07 and acc-b keyframes 03-10, 04-01, 04-03; one disposal
  (sell-a1 vs buy-a1); valuations 03-10..04-10 dense; no duplicated 03-31
  row and no re-stamped Q1 flow.
