id: NOM-TXF-02
title: Paired security transfer carries lots with original dates and basis
intent: >
  acc-a bought 10 aapl (basis 1005) on 01-03 and transfers them to acc-b on
  01-08 (TRANSFER_OUT / TRANSFER_IN paired by source_group_id, same
  quantity). The source processes first (topological order); its removed
  lots travel through the transfer cache so acc-b's lot keeps open_date
  01-03, cost_per_unit 100 and fee 5. net_contribution moves -1005 / +1005.
  With a transfer-date quote the account-scope flows are quote-derived.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-12
accounts:
  - id: acc-a
    name: Source
    currency: USD
  - id: acc-b
    name: Destination
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-a
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 2000
  - id: dep-2
    account: acc-b
    type: DEPOSIT
    date: 2025-01-02T11:00:00Z
    amount: 100
  - id: buy-1
    account: acc-a
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100
    amount: 1005
    fee: 5
  - id: out-1
    account: acc-a
    type: TRANSFER_OUT
    date: 2025-01-08T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100.5
    source_group_id: g1
  - id: in-1
    account: acc-b
    type: TRANSFER_IN
    date: 2025-01-08T11:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100.5
    source_group_id: g1
quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
  - { asset: aapl, day: 2025-01-08, close: 110 }
  - { asset: aapl, day: 2025-01-12, close: 115 }
expected_notes: >
  acc-a: cash 995 from 01-03; position 10 aapl (basis 1005) until 01-08,
  none afterwards; net_contribution 2000 then 995 from 01-08; lot buy-1
  closed 01-08 by out-1; disposal out-1 proceeds 1005 = cost basis, realized
  0. acc-b: lot id in-1 with open_date 2025-01-03, original_quantity 10,
  cost_per_unit 100, original_cost_basis 1005, fee_allocated 5,
  open_activity_id in-1; keyframe 01-08 position 10 aapl average 100.5;
  net_contribution 100 -> 1105. Account flows 01-08: acc-a outflow 1100,
  acc-b inflow 1100, both QUOTE_DERIVED_MARKET_VALUE (10 x 110). Portfolio:
  the 01-08 row nets to zero (source MIXED); portfolio net_contribution 2100
  throughout; portfolio total value 2095 (01-03) -> 2195 (01-08) -> 2245
  (01-12). LEGACY BEHAVIOR (attribution): account scopes value the transfer
  at market (1100) while the lot carries basis 1005, so acc-a reports
  "difference 100" and acc-b "difference -95"; at portfolio scope the buy-1
  fee (5) is attributed but its gross-up cannot find the lot (it now belongs
  to in-1 in acc-b), leaving "difference 5".
