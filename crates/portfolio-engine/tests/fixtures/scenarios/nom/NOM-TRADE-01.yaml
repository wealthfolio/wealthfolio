id: NOM-TRADE-01
title: Buy, buy, partial sell, sell-all with FIFO lots and disposal base attribution
intent: >
  Two BUY lots of a USD asset in a CAD account (base CAD), a partial SELL that
  closes the first lot and half of the second (FIFO), then a SELL that closes
  the rest. Realized P&L per disposal slice; base attribution converts
  proceeds at the disposal-date FX and cost basis at each lot's
  acquisition-date FX. Daily USD/CAD rates avoid nearest-neighbour ambiguity.
