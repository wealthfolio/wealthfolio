id: NOM-CASH-01
title: Deposit then withdrawal, single currency
intent: >
  Cash and net_contribution track exactly (same resolved amount on both
  activities). No positions, no FX. Dense valuations end at as_of.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    name: Brokerage
    currency: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: wd-1
    account: acc-1
    type: WITHDRAWAL
    date: 2025-01-06T10:00:00Z
    amount: 250
expected_notes: >
  Cash USD 1000 from 01-02 and 750 from 01-06; net_contribution equals cash on
  every day; total_value tracks cash; both flows are External at account and
  portfolio scope; TWR is 0% because there is no market movement.
