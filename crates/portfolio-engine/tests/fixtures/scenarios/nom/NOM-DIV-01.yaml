id: NOM-DIV-01
title: Cash dividend with withholding tax
intent: >
  A DIVIDEND stores net cash in `amount` and the withholding in `tax`. Cash
  moves by the net amount only; income attribution is gross (amount + tax)
  with the tax attributed separately; the position and net_contribution are
  untouched.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-12
accounts:
  - id: acc-1
    name: Brokerage
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 2000
  - id: buy-1
    account: acc-1
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100
    amount: 1000
    fee: 0
  - id: div-1
    account: acc-1
    type: DIVIDEND
    date: 2025-01-08T10:00:00Z
    asset: aapl
    amount: 85
    tax: 15
quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
  - { asset: aapl, day: 2025-01-08, close: 100 }
  - { asset: aapl, day: 2025-01-12, close: 100 }
expected_notes: >
  Cash 2000 -> 1000 (buy) -> 1085 (dividend, net). Position aapl 10 @ 100,
  cost basis 1000 on every keyframe from 01-03; the dividend adds no lot.
  net_contribution 2000 throughout; no flows after the first row. Attribution:
  income 100 (gross = 85 + 15), taxes 15, fees 0, realized 0, unrealized 0.
  Total value 2000 -> 2085 on 01-08; TWR = 2085/2000 - 1 = 4.25%.
