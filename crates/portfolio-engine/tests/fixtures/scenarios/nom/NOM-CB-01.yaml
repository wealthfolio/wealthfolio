id: NOM-CB-01
title: A WAC account's sales relieve the average cost and leave it unchanged
intent: >
  Rules R7.2, WAC. Two buys, a partial sale, a third buy and a second
  partial sale. Before each sale the lots pool into one, so the cost a sale
  relieves is the position's average cost (charges included), the average
  after it is the average before it, and each sale is one disposal; a buy
  re-averages. The pool keeps the first lot's id.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    name: Brokerage
    currency: USD
    cost_basis_method: WAC
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - { id: dep-1, account: acc-1, type: DEPOSIT, date: 2025-01-02T10:00:00Z, amount: 3000 }
  - { id: buy-1, account: acc-1, type: BUY, date: 2025-01-03T10:00:00Z, asset: aapl, quantity: 10, unit_price: 10, amount: 102, fee: 2 }
  - { id: buy-2, account: acc-1, type: BUY, date: 2025-01-06T10:00:00Z, asset: aapl, quantity: 10, unit_price: 20, amount: 202, fee: 2 }
  - { id: sell-1, account: acc-1, type: SELL, date: 2025-01-07T10:00:00Z, asset: aapl, quantity: 5, unit_price: 25, amount: 124, fee: 1 }
  - { id: buy-3, account: acc-1, type: BUY, date: 2025-01-08T10:00:00Z, asset: aapl, quantity: 10, unit_price: 30, amount: 302, fee: 2 }
  - { id: sell-2, account: acc-1, type: SELL, date: 2025-01-09T10:00:00Z, asset: aapl, quantity: 10, unit_price: 32, amount: 320, fee: 0 }
quotes:
  - { asset: aapl, day: 2025-01-03, close: 10 }
  - { asset: aapl, day: 2025-01-06, close: 20 }
  - { asset: aapl, day: 2025-01-07, close: 25 }
  - { asset: aapl, day: 2025-01-08, close: 30 }
  - { asset: aapl, day: 2025-01-09, close: 32 }
  - { asset: aapl, day: 2025-01-10, close: 32 }
expected_notes: >
  Lots buy-1 (10, basis 102, fee 2) and buy-2 (10, basis 202, fee 2): 20
  units, 304, average 15.2. sell-1 pools them into buy-1 (20 units, 304,
  fees 4), then takes 5 of 20: cost 76 = 5 x 15.2, proceeds 124, P&L 48, one
  disposal. Left: 15 units, 228 (fees 3), average 15.2 as before. buy-3 (10,
  302, fee 2). sell-2 pools buy-1 and buy-3 (25 units, 530, fees 5; its
  price is (530 - 5) / 25 = 21, its original these 25 units at 530), then
  takes 10 of 25: cost 212 = 10 x 21.2, proceeds 320, P&L 108, one
  disposal. Left: buy-1 15 units, 318, average 21.2. Attribution: realized
  156 + the sale fee 1 + 3 of purchase fees the sales relieved = 160;
  unrealized 162 + the 3 purchase fees still held = 165; fees 7; total gain
  160 + 165 - 7 = 318. Cash 3000 - 102 - 202 + 124 - 302 + 320 = 2838. Under
  FIFO sell-1 would relieve 5 of buy-1 at 51 (P&L 73, average after
  16.86666667).
