quotes:
  - { asset: aapl, day: 2025-01-03, close: 100 }
  - { asset: aapl, day: 2025-01-08, close: 105 }
  - { asset: aapl, day: 2025-01-12, close: 108 }
expected_notes: >
  acc-a: as in NOM-TXF-02 (cash 995, lot removed on 01-08, disposal at
  basis, net_contribution 995, flow 01-08 outflow 1050). acc-b before 01-08:
  cash 2400, position -4 with cost basis -400, market value -4 x price. On
  01-08: disposal in-1:short-1:0 with quantity -4, proceeds -402 (the cover
  lots' basis), cost basis -400, realized -2; lot short-1 closed by in-1;
  residual lot in-1 of 6 units, basis 603 (fee 3), open_date 01-03;
  keyframe position +6, total_cost_basis 603, average 100.5. Flow 01-08
  inflow 1050 QUOTE_DERIVED_MARKET_VALUE; portfolio row nets to zero
  (MIXED). LEGACY BEHAVIOR: net_contribution 2000 -> 3003 = 2000 + 400
  (covered short basis relieved) + 603 (residual lots), while acc-a gave up
  1005: the pair is asymmetric by the -2 cover P&L, which leaks into the
  contribution instead of staying in performance. Candidate for the
  divergence ledger. Attribution diagnostics: acc-a difference 50, acc-b
  difference -47 (transfer valued at market vs lots at basis).
