id: NOM-TXF-04
title: Paired TRANSFER_IN of long lots into an account that is short the asset
intent: >
  acc-b is short 4 aapl (SELL with POSITION_OPEN) when a paired transfer
  brings in 10 long aapl lots (basis 100.5/unit) from acc-a. The incoming
  lots first cover the short (4 units, prorated basis 402 as cover
  proceeds), a disposal is recorded against the short lot, and only the
  residual 6 units are added as lots. net_contribution is relieved of the
  covered short basis and increased by the residual lots' basis.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-12
accounts:
  - id: acc-a
    name: Long
    currency: USD
  - id: acc-b
    name: Short
    currency: USD
assets:
  - id: aapl
    quote_ccy: USD
activities:
  - id: dep-1
    account: acc-a
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 2000
  - id: dep-2
    account: acc-b
    type: DEPOSIT
    date: 2025-01-02T11:00:00Z
    amount: 2000
  - id: buy-1
    account: acc-a
    type: BUY
    date: 2025-01-03T10:00:00Z
    asset: aapl
    quantity: 10
    unit_price: 100
    amount: 1005
    fee: 5
  - id: short-1
    account: acc-b
    type: SELL
    subtype: POSITION_OPEN
    date: 2025-01-03T11:00:00Z
    asset: aapl
    quantity: 4
    unit_price: 100
    amount: 400
    fee: 0
  - id: out-1
