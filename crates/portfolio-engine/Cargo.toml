[package]
name = "wealthfolio-portfolio-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure, deterministic portfolio calculation kernel (facts in, values out)"

[lints]
workspace = true

# Closed runtime dependency list (architecture §4.1): tests/dependencies.rs
# asserts this set, so anything else fails the test suite, not a review.
[dependencies]
chrono = { workspace = true }
chrono-tz = { version = "0.10", features = ["serde"] }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
insta = { version = "1", features = ["yaml"] }
serde_json = { workspace = true }
serde_yaml = "0.9"

[[bench]]
name = "scale"
harness = false
