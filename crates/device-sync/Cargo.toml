[package]
name = "wealthfolio-device-sync"
version.workspace = true
edition.workspace = true

[dependencies]
wealthfolio-http = { workspace = true }
# Core (for SecretStore trait)
wealthfolio-core = { path = "../core" }

# HTTP client
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = "1"
chrono = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
log = { workspace = true }

# Crypto
zeroize = { workspace = true }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
hmac = "0.13"
hkdf = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
rand = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
