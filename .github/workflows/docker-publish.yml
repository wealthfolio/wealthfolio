name: Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wealthfolio/wealthfolio
      - name: Build native image once
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wealthfolio-smoke:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
          build-args: |
            CONNECT_AUTH_URL=${{ vars.CONNECT_AUTH_URL }}
            CONNECT_AUTH_PUBLISHABLE_KEY=${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
            CONNECT_API_URL=${{ vars.CONNECT_API_URL }}
      - name: Test encryption in the built image
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-smoke:ci
      - name: Log into Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log into GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload tested image under a staging tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/wealthfolio
          STAGING_TAG: ci-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          for image in docker.io/wealthfolio/wealthfolio docker.io/afadil/wealthfolio "$GHCR_IMAGE"; do
            docker tag wealthfolio-smoke:ci "$image:$STAGING_TAG"
            docker push "$image:$STAGING_TAG"
          done

  publish:
    # Release tags move only after BOTH architectures have passed their tests.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/wealthfolio/wealthfolio
            docker.io/afadil/wealthfolio
            ghcr.io/${{ github.repository_owner }}/wealthfolio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,format=long
      - name: Publish manifests from tested images (no rebuild)
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          STAGING_PREFIX: ci-${{ github.run_id }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag"
            image="${tag%:*}"
            docker buildx imagetools create --tag "$tag" \
              "$image:$STAGING_PREFIX-amd64" "$image:$STAGING_PREFIX-arm64"
          done <<< "$RELEASE_TAGS"
