name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      formatting: ${{ steps.filter.outputs.formatting }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test change detection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          python3 .github/scripts/ci_changes.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  translation-parity:
    name: Translation parity
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test translation checker
        run: node --test apps/frontend/scripts/check-translations.test.mjs
      - name: Check every language and namespace
        run: node apps/frontend/scripts/check-translations.mjs

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.formatting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check

  frontend-check:
    name: Frontend Check
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package types
        run: pnpm run build:types

      - name: Lint
        run: pnpm lint

      - name: Type check packages
        # Declarations are already built above; the frontend build runs its type check.
        run: pnpm --filter './packages/*' -r type-check

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Install addon sandbox browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run net worth layout regression tests
        run: pnpm test:e2e:net-worth

      - name: Run addon sandbox browser tests
        run: pnpm test:e2e:addon-sandbox
        env:
          WF_ADDON_SANDBOX_SKIP_BUILD: "true"

  rust-check:
    name: Rust Check
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Create dist folder for Tauri context
        run:
          mkdir -p dist && echo '<!DOCTYPE html><html><head></head><body></body></html>' >
          dist/index.html

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
        env:
          # Required for outbox tests in storage-sqlite
          CONNECT_API_URL: http://test.local

      - name: Test AI tools with fixture support
        run: cargo test --locked -p wealthfolio-ai --features test-utils

      - name: Check release build (src-server)
        run: cargo check --locked -p wealthfolio-server --release

  android-check:
    name: Android compile check
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Android target for the repository toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" >> "$GITHUB_ENV"
      - name: Check Android Rust compilation
        run: |
          toolchain="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          mkdir -p dist
          printf '<!DOCTYPE html><html></html>' > dist/index.html
          cargo check --locked -p wealthfolio-app --target aarch64-linux-android

  ios-check:
    name: iOS compile check
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS targets for the repository toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Check iOS device and simulator compilation
        run: |
          mkdir -p dist
          printf '<!DOCTYPE html><html></html>' > dist/index.html
          cargo check --locked -p wealthfolio-app --target aarch64-apple-ios
          cargo check --locked -p wealthfolio-app --target aarch64-apple-ios-sim

  build-status:
    name: Build Status
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        formatting,
        translation-parity,
        frontend-check,
        rust-check,
        android-check,
        ios-check,
      ]
    if: always()

    steps:
      - name: Check build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMATTING_REQUIRED: ${{ needs.changes.outputs.formatting }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.android-check.result }}
          IOS_REQUIRED: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.ios-check.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          TRANSLATION_RESULT: ${{ needs.translation-parity.result }}
          FRONTEND_RESULT: ${{ needs.frontend-check.result }}
          RUST_RESULT: ${{ needs.rust-check.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONTEND_REQUIRED" = true ]; then
            test "$FRONTEND_RESULT" = success
            test "$TRANSLATION_RESULT" = success
          fi
          if [ "$RUST_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
          fi
          if [ "$FORMATTING_REQUIRED" = true ]; then
            test "$FORMATTING_RESULT" = success
          fi
          if [ "$ANDROID_REQUIRED" = true ]; then
            test "$ANDROID_RESULT" = success
          fi
          if [ "$IOS_REQUIRED" = true ]; then
            test "$IOS_RESULT" = success
          fi
          echo "All required checks passed."
