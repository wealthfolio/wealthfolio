name: Server secret store

on:
  pull_request:
    paths:
      - "apps/server/src/secrets/**"
      - "apps/server/src/main_lib.rs"
      - "apps/server/src/config.rs"
      - "apps/server/src/auth.rs"
      - "apps/server/Cargo.toml"
      - "crates/core/src/secrets/**"
      - "crates/storage-sqlite/src/db/**"
      - "crates/storage-sqlite/Cargo.toml"
      - "crates/storage-sqlite/migrations/**"
      - "crates/storage-sqlite/tests/portable_fixtures.rs"
      - "crates/storage-sqlite/tests/fixtures/portable-v1/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/server-secret-store.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vault:
    name: Vault compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored OpenSSL Perl prerequisite
        shell: bash
        run: perl -v

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test vault compatibility, validation, and persistence
        run: cargo test --locked -p wealthfolio-server --lib secrets
      - name: Test environment and file key inputs
        run: cargo test --locked -p wealthfolio-server --lib config::tests
      - name: Report embedded migration line endings
        run:
          git ls-files --eol
          crates/storage-sqlite/migrations/2026-05-25-000002_allocation_targets/up.sql
      - name: Read frozen portable backups and reject corruption
        run: cargo test --locked -p wealthfolio-storage-sqlite --test portable_fixtures
      - name: Test administrator-owned vault and individual file mount
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture_dir=$(mktemp -d)
          trap 'sudo umount "$fixture_dir/mounted" 2>/dev/null || true; rm -rf "$fixture_dir"' EXIT
          sudo install -m 0660 -o root -g "$(id -g)" /dev/null "$fixture_dir/source"
          touch "$fixture_dir/mounted"
          sudo mount --bind "$fixture_dir/source" "$fixture_dir/mounted"
          for fixture in "$fixture_dir/source" "$fixture_dir/mounted"; do
            WF_VAULT_DEPLOYMENT_FIXTURE="$fixture" cargo test --locked -p wealthfolio-server --lib secrets::tests::deployment_file_fixture -- --exact
          done
