name: Warm Rust Cache

# Release builds run on tag refs, which can only restore caches created on the
# default branch. This workflow compiles the release-profile dependency graph
# on main and saves it under the shared-keys that release.yml restores.
#
# Dependency artifacts (the only thing rust-cache keeps - workspace crates are
# pruned) only change when Cargo.lock, a manifest's features or profiles, or
# the toolchain changes, hence the narrow path filter. The weekly run keeps caches alive (GitHub evicts caches
# unused for 7 days) and re-warms after stable rustc bumps.
#
# macOS release jobs (~18 min cold) are deliberately not warmed to stay under
# the 10 GB per-repo cache limit; Linux and Windows are the expensive ones.
#
# warm-pr-check seeds the cache that pr-check.yml's Rust Check restores; PR
# runs restore it without saving.
#
# warm-docker-deps exports the Dockerfile's dependency layers to the
# wealthfolio-build-cache GHCR package, outside the Actions cache budget.
# docker-publish.yml imports it without logging in, so the package must stay
# public, or Docker builds compile every dependency. Dockerfile changes also
# rewarm it.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain*"
      - ".github/workflows/cache-warm.yml"
      - "Dockerfile"
      - ".dockerignore"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  warm-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04"
            cache-key: linux-x86_64
            args: ""
          - platform: "ubuntu-24.04-arm"
            cache-key: linux-aarch64
            args: ""
          - platform: "windows-latest"
            cache-key: windows-x86_64
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - platform: "windows-latest"
            cache-key: windows-aarch64
            target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev libsoup2.4-dev javascriptcoregtk-4.0 webkit2gtk-4.0 xdg-utils

      - name: Verify vendored OpenSSL Perl prerequisite
        shell: bash
        run: perl -v

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target (windows only)
        # Explicit `rustup target add` like release.yml: the preinstalled
        # stable toolchain makes the action's targets input a silent no-op.
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.cache-key }}

      - name: Stub frontend dist
        # tauri::generate_context! reads frontendDist (../../dist) at compile
        # time; a placeholder is enough since the app crate itself is pruned
        # from the cache anyway.
        shell: bash
        run:
          mkdir -p dist && echo '<!DOCTYPE html><html><head></head><body></body></html>' >
          dist/index.html

      - name: Build release dependencies
        # Mirrors what tauri-action runs: release profile, custom-protocol on.
        run:
          cargo build --locked --release -p wealthfolio-app --features custom-protocol ${{
          matrix.args }}

  warm-server:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev build-essential perl

      - name: Verify vendored OpenSSL Perl prerequisite
        shell: bash
        run: perl -v

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: prebuild-server-linux-amd64

      - name: Stub frontend dist
        run:
          mkdir -p dist && echo '<!DOCTYPE html><html><head></head><body></body></html>' >
          dist/index.html

      - name: Build server binary
        env:
          # OPENSSL_STATIC affects how openssl-sys (a cached dependency) is
          # built - must match the release job.
          OPENSSL_STATIC: "1"
        run: cargo build --locked --release --manifest-path apps/server/Cargo.toml

  warm-pr-check:
    # Keep runs-on, env, toolchain setup, cache inputs and cargo builds in sync
    # with the rust-check job in pr-check.yml; any drift makes PRs build cold.
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: pr-rust-check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Stub frontend dist
        run:
          mkdir -p dist && echo '<!DOCTYPE html><html><head></head><body></body></html>' >
          dist/index.html

      - name: Build PR check dependencies
        # Rust Check's builds without running tests. Lint and test flags only
        # affect workspace crates, which rust-cache prunes.
        run: |
          cargo clippy --locked --workspace --all-targets --all-features
          CONNECT_API_URL=http://test.local cargo test --locked --workspace --no-run
          cargo test --locked -p wealthfolio-ai --features test-utils --no-run
          cargo check --locked -p wealthfolio-server --release

  warm-docker-deps:
    # Unlike Actions caches, these registry tags are shared by every ref, so
    # only main writes them.
    if: github.ref == 'refs/heads/main'
    # Keep the cache refs, platforms and runners in sync with docker-publish.yml,
    # which imports these layers; any drift makes Docker builds cold.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export Docker dependency layers
        # Builds only the deps stage: no Connect build args or secrets reach it.
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: deps
          outputs: type=cacheonly
          cache-from:
            type=registry,ref=ghcr.io/${{ github.repository_owner
            }}/wealthfolio-build-cache:deps-${{ matrix.arch }}
          cache-to:
            type=registry,ref=ghcr.io/${{ github.repository_owner
            }}/wealthfolio-build-cache:deps-${{ matrix.arch
            }},mode=max,image-manifest=true,oci-mediatypes=true
