name: Native secret store

on:
  pull_request:
    paths:
      - "apps/tauri/src/secret_store/**"
      - "apps/tauri/src/secret_store.rs"
      - "apps/tauri/Cargo.toml"
      - "crates/core/src/secrets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/native-secret-store.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-store:
    name: Credential compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev gnome-keyring dbus-x11
      - name: Prepare frontend placeholder
        shell: bash
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head></head><body></body></html>' > dist/index.html
      - name: Test native store and legacy compatibility
        if: runner.os != 'Linux'
        run:
          cargo test --locked -p wealthfolio-app --lib secret_store::tests -- --ignored
          --test-threads=1
      - name: Test Linux Secret Service with an unlocked keyring
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "test-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p wealthfolio-app --lib secret_store::tests -- --ignored --test-threads=1
          '
      - name: Check iOS device and simulator
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo check --locked -p wealthfolio-app --target aarch64-apple-ios
          cargo check --locked -p wealthfolio-app --target aarch64-apple-ios-sim
