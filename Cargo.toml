[workspace]
resolver = "2"
members = [
    "apps/tauri",
    "apps/server",
    "crates/*",
]

[workspace.package]
version = "3.9.0"
edition = "2021"
license = "AGPL-3.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
# Keep file/line backtraces without full type and variable debug information.
debug = "line-tables-only"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
diesel = { version = "2.2", features = ["sqlite", "chrono", "r2d2", "numeric", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# SQLCipher: enabling it on the single shared `libsqlite3-sys` transparently
# encrypts Diesel's and rusqlite's query layers alike. Always compiled in — with
# no key applied SQLCipher behaves as plain SQLite and opens plaintext databases
# unchanged, so there is exactly one build configuration to test.
libsqlite3-sys = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
r2d2 = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form", "stream"] }

# Error handling
thiserror = "1"
anyhow = "1"

# IDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Numbers
rust_decimal = { version = "1.39", features = ["maths", "serde-float"] }
rust_decimal_macros = "1.39"
num-traits = "0.2"

# Async
async-trait = "0.1"
futures = "0.3"

# MCP (Model Context Protocol)
rmcp = { version = "1.7", default-features = false, features = ["server", "transport-streamable-http-server"] }

# Logging
log = "0.4"

# Crypto
chacha20poly1305 = { version = "0.10", features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
zeroize = "1"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"

# Internal crates
wealthfolio-http = { path = "crates/http" }
wealthfolio-market-data = { path = "crates/market-data" }
wealthfolio-core = { path = "crates/core" }
wealthfolio-connect = { path = "crates/connect" }
wealthfolio-storage-sqlite = { path = "crates/storage-sqlite" }
wealthfolio-device-sync = { path = "crates/device-sync" }
wealthfolio-ai = { path = "crates/ai" }
wealthfolio-spending = { path = "crates/spending" }
wealthfolio-agent-tools = { path = "crates/agent-tools" }
wealthfolio-mcp = { path = "crates/wealthfolio-mcp" }

# Tauri 2.x requires tao 0.35; this upstream fix keeps the iOS scene configuration alive.
# Remove when a Tauri release accepts tao >= 0.36.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508" }
