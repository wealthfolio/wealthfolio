name: wealthfolio-app
options:
  bundleIdPrefix: com.teymz.wealthfolio
  projectFormat: xcode14_0
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Wealthfolio
      PRODUCT_BUNDLE_IDENTIFIER: com.teymz.wealthfolio
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  wealthfolio-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The widgets' snapshot bridge, shared with the macOS app.
      - path: ../../widget-bridge/Sources/WidgetBridge
      - path: Assets.xcassets
      - path: AppIcon.icon
      - path: wealthfolio-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: wealthfolio-app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 3.13.0
        CFBundleVersion: "1"
    entitlements:
      path: wealthfolio-app_iOS/wealthfolio-app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        CODE_SIGN_ENTITLEMENTS: $(TARGET_TEMP_DIR)/wealthfolio-app_iOS.entitlements
        DEVELOPMENT_TEAM: DYDJ2RNL5H
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: WidgetKit.framework
      - target: WealthfolioWidget
    preBuildScripts:
      - script: |
          set -e
          # Xcode does not load the interactive shell setup for Node or Rust.
          export PATH="$PATH:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin"
          if command -v fnm >/dev/null 2>&1; then
            eval "$(fnm env --shell bash)"
            fnm use "$(cat "${SRCROOT}/../../../../.node-version")"
          fi
          cp "${SRCROOT}/wealthfolio-app_iOS/wealthfolio-app_iOS.entitlements" "${TARGET_TEMP_DIR}/wealthfolio-app_iOS.entitlements" && pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  WealthfolioWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WealthfolioWidget
    info:
      path: WealthfolioWidget/Info.plist
      properties:
        CFBundleDisplayName: Wealthfolio
        # Must match the app's version (bumped together at release).
        CFBundleShortVersionString: 3.13.0
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WealthfolioWidget/WealthfolioWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.teymz.wealthfolio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teymz.wealthfolio.widget
        PRODUCT_NAME: WealthfolioWidget
        DEVELOPMENT_TEAM: DYDJ2RNL5H
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        ARCHS: [arm64]
        VALID_ARCHS: arm64
