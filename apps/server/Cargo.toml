[package]
name = "wealthfolio-server"
version.workspace = true
edition.workspace = true

[dependencies]
wealthfolio-http = { workspace = true }
# Internal crates
wealthfolio-market-data = { workspace = true }
wealthfolio-core = { workspace = true }
wealthfolio-connect = { workspace = true }
wealthfolio-storage-sqlite = { workspace = true }
wealthfolio-device-sync = { workspace = true }
wealthfolio-ai = { workspace = true }
wealthfolio-spending = { workspace = true }
wealthfolio-agent-tools = { workspace = true }
wealthfolio-mcp = { workspace = true }

# Web framework
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout", "request-id", "fs"] }

# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }

uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# Stable openidconnect 4 uses reqwest 0.12 for its HTTP transport.
reqwest-oidc = { package = "reqwest", version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }

# Additional dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
dotenvy = "0.15"
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
serde_with = "3"
serde_urlencoded = "0.7"
base64 = "0.21"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
tower_governor = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-core = "0.3"
semver = "1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
rmcp = { workspace = true }
subtle = "2"

[features]
default = ["connect-sync", "device-sync"]
connect-sync = []
device-sync = []

[dev-dependencies]
reqwest = { workspace = true }
tempfile = "3"
